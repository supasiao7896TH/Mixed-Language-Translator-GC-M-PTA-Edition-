<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PTA Language Assistant — GC-M</title>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
:root {
  --a:    oklch(0.50 0.14 193); --ah: oklch(0.42 0.14 193);
  --al:   oklch(0.94 0.05 193); --at: oklch(0.28 0.14 193);
  --bg:   oklch(0.975 0.006 220);
  --srf:  #ffffff;               --srf2: oklch(0.955 0.007 220);
  --txt:  oklch(0.15 0.01 230);  --t2: oklch(0.46 0.02 220);
  --t3:   oklch(0.68 0.01 220);
  --bdr:  oklch(0.89 0.012 220); --bdr2: oklch(0.82 0.015 220);
  --ok:   oklch(0.52 0.14 150);  --okl: oklch(0.95 0.04 150);
  --tip:  oklch(0.56 0.12 60);   --tipl: oklch(0.97 0.04 60);
  --err:  #dc2626;               --errl: #fef2f2;
  --warn: oklch(0.55 0.14 60);   --warnl: oklch(0.97 0.04 60);
  --sh:   0 1px 3px oklch(0 0 0/0.07);
  --sh2:  0 6px 20px oklch(0 0 0/0.10);
  --r: 8px; --r2: 12px; --hh: 52px;
}
/* Dark Mode */
.dark {
  --bg:   oklch(0.13 0.008 220);
  --srf:  oklch(0.18 0.01 220);  --srf2: oklch(0.23 0.01 220);
  --txt:  oklch(0.93 0.005 220); --t2: oklch(0.67 0.01 220);
  --t3:   oklch(0.48 0.01 220);
  --bdr:  oklch(0.30 0.01 220);  --bdr2: oklch(0.38 0.01 220);
  --al:   oklch(0.24 0.05 193);  --at: oklch(0.82 0.08 193);
  --okl:  oklch(0.20 0.04 150);
  --tipl: oklch(0.22 0.04 60);   --warnl: oklch(0.22 0.05 60);
  --errl: oklch(0.20 0.05 25);
}
*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
html,body,#root { height: 100%; }
body { font-family:'Sarabun','Lexend',system-ui,sans-serif; font-size:15px;
  line-height:1.6; background:var(--bg); color:var(--txt); overflow:hidden; transition:background .2s,color .2s; }

/* ── Shell ── */
.app { display:flex; flex-direction:column; height:100vh; }
.app-hd {
  height:var(--hh); min-height:var(--hh);
  background:var(--srf); border-bottom:1.5px solid var(--bdr);
  display:flex; align-items:center; padding:0 14px; gap:10px;
  box-shadow:var(--sh); z-index:20; position:relative;
}
.brand { display:flex; align-items:center; gap:8px; }
.brand-name { font-family:'Lexend',sans-serif; font-weight:700; font-size:15px;
  color:var(--a); letter-spacing:-0.01em; white-space:nowrap; }
.brand-tag { font-size:10px; font-weight:700; background:var(--al); color:var(--at);
  padding:2px 7px; border-radius:99px; letter-spacing:0.06em; }
.hd-c { flex:1; display:flex; justify-content:center; }
.lay-tabs { display:flex; background:var(--srf2); border:1px solid var(--bdr);
  border-radius:8px; padding:3px; gap:2px; }
.lay-tab { font-family:'Lexend',sans-serif; font-size:11px; font-weight:500;
  padding:4px 11px; border:none; background:none; color:var(--t2);
  border-radius:5px; cursor:pointer; transition:all .15s; white-space:nowrap; }
.lay-tab:hover { color:var(--txt); background:var(--srf); }
.lay-tab.on { background:var(--a); color:#fff; }
.hd-right { display:flex; align-items:center; gap:7px; }
.api-btn { font-size:12px; padding:5px 11px; border-radius:99px;
  border:1.5px solid var(--bdr); background:none; cursor:pointer;
  transition:all .15s; white-space:nowrap; color:var(--t2); }
.api-btn.ok { border-color:var(--ok); color:var(--ok); }
.api-btn.no { border-color:var(--err); color:var(--err); }
.api-btn:hover { background:var(--srf2); }
.icon-btn { width:32px; height:32px; border:1.5px solid var(--bdr); border-radius:8px;
  background:none; cursor:pointer; display:flex; align-items:center; justify-content:center;
  font-size:15px; transition:all .15s; color:var(--t2); }
.icon-btn:hover { background:var(--srf2); border-color:var(--a); color:var(--a); }
.app-main { flex:1; overflow:hidden; }

/* ── Layouts ── */
.ly-split { display:grid; grid-template-columns:400px 1fr; height:100%; position:relative; }
.ly-cmd   { display:grid; grid-template-columns:216px 1fr 256px; height:100%; }
.ly-flow  { height:100%; overflow-y:auto; }
.flow-inner { max-width:860px; width:100%; margin:0 auto; padding:20px 20px 0;
  display:flex; flex-direction:column; gap:12px; }
.flow-div { display:flex; align-items:center; gap:10px; color:var(--t3); font-size:13px; }
.flow-div-line { flex:1; height:1px; background:var(--bdr); }
.flow-tabs-wrap { max-width:860px; width:100%; margin:0 auto;
  padding:0 20px 20px; height:296px; }
.flow-tab-hd { display:flex; border-bottom:1.5px solid var(--bdr); }
.flow-tab-btn { padding:8px 16px; font-size:13px; border:none; background:none;
  color:var(--t2); cursor:pointer; border-bottom:2.5px solid transparent;
  margin-bottom:-1.5px; transition:all .15s; }
.flow-tab-btn.on { color:var(--a); border-bottom-color:var(--a); font-weight:600; }
.flow-tab-body { height:calc(100% - 38px); }
.cmd-main { display:flex; flex-direction:column; height:100%; overflow:hidden;
  border-left:1.5px solid var(--bdr); border-right:1.5px solid var(--bdr); }
.cmd-main .inp-panel { flex:0 0 auto; border-bottom:1.5px solid var(--bdr); }
.cmd-main .out-panel { flex:1; overflow:hidden; }
.sp-inp { height:100%; border-right:1.5px solid var(--bdr); }
.sp-out { height:100%; }

/* ── Panel base ── */
.panel { background:var(--srf); display:flex; flex-direction:column; overflow:hidden; }
.flow-card { border:1.5px solid var(--bdr); border-radius:var(--r2); }
.ph { display:flex; align-items:center; justify-content:space-between;
  padding:9px 13px; border-bottom:1px solid var(--bdr); min-height:40px; gap:6px; }
.pt { font-size:12px; font-weight:700; color:var(--t2);
  text-transform:uppercase; letter-spacing:.05em; }
.p-scroll { flex:1; overflow-y:auto; }
.p-empty { padding:24px 14px; text-align:center; color:var(--t3); font-size:13px; }

/* ── Direction Toggle ── */
.dir-row { display:flex; align-items:center; gap:6px; }
.dir-lbl { font-size:11px; color:var(--t3); }
.dir-seg { display:flex; background:var(--srf2); border:1px solid var(--bdr);
  border-radius:6px; padding:2px; gap:2px; }
.dir-btn { font-size:11px; padding:3px 9px; border:none; background:none;
  color:var(--t2); border-radius:4px; cursor:pointer; transition:all .15s; white-space:nowrap; }
.dir-btn.on { background:var(--a); color:#fff; font-weight:600; }

/* ── Input Panel ── */
.inp-panel { }
.inp-ta {
  flex:1; width:100%; padding:11px 14px; min-height:120px;
  font-family:'Sarabun',sans-serif; font-size:inherit; line-height:1.75;
  color:var(--txt); border:none; outline:none; resize:none; background:var(--srf);
}
.inp-ta::placeholder { color:var(--t3); }
/* Sensitive strip */
.sens-strip { padding:5px 13px; background:var(--warnl); border-top:1px solid oklch(0.86 0.08 60);
  display:flex; align-items:flex-start; gap:6px; font-size:11px; color:var(--warn); }
.sens-strip-tags { flex:1; line-height:1.5; word-break:break-all; }
.inp-ctrl { padding:8px 12px; border-top:1px solid var(--bdr);
  display:flex; flex-direction:column; gap:7px; background:var(--srf2); }
.ctx-row { display:flex; align-items:flex-start; gap:7px; flex-wrap:wrap; }
.ctx-lbl { font-size:12px; color:var(--t2); font-weight:600; padding-top:5px; white-space:nowrap; }
.ctx-btns { display:flex; gap:4px; flex-wrap:wrap; }
.ctx-btn { font-family:'Sarabun',sans-serif; font-size:12px; padding:4px 8px;
  border:1.5px solid var(--bdr); border-radius:6px; background:var(--srf);
  color:var(--t2); cursor:pointer; transition:all .15s; }
.ctx-btn:hover { border-color:var(--a); color:var(--a); }
.ctx-btn.on { border-color:var(--a); background:var(--al); color:var(--at); font-weight:600; }
.tr-btn { width:100%; padding:9px; font-family:'Lexend','Sarabun',sans-serif;
  font-size:14px; font-weight:600; background:var(--a); color:#fff; border:none;
  border-radius:var(--r); cursor:pointer; transition:all .18s;
  display:flex; align-items:center; justify-content:center; gap:8px; }
.tr-btn:hover:not(:disabled) { background:var(--ah); }
.tr-btn:disabled { opacity:.5; cursor:not-allowed; }
.shortcut { font-size:10px; opacity:.65; background:rgba(255,255,255,.18);
  padding:1px 5px; border-radius:3px; }
.char-c { font-size:11px; color:var(--t3); }
/* Voice button */
.voice-btn { width:28px; height:28px; border:1.5px solid var(--bdr); border-radius:7px;
  background:var(--srf); font-size:14px; cursor:pointer; transition:all .15s;
  display:flex; align-items:center; justify-content:center; }
.voice-btn:hover { border-color:var(--a); background:var(--al); }
.voice-btn.active { border-color:var(--err); background:#fef2f2; animation:pulse 1s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }

/* ── Output Panel ── */
.out-panel { height:100%; }
.out-panel.s-load,.out-panel.s-err,.out-panel.s-empty {
  display:flex; align-items:center; justify-content:center; }
.out-scroll { flex:1; overflow-y:auto; padding:14px; }
/* Loading */
.ld-c { text-align:center; }
.ld-ring { display:inline-block; width:44px; height:44px; position:relative; margin-bottom:14px; }
.ld-ring div { box-sizing:border-box; display:block; position:absolute; width:36px; height:36px;
  margin:4px; border:3px solid var(--a); border-radius:50%;
  animation:ring 1.2s cubic-bezier(.5,0,.5,1) infinite;
  border-color:var(--a) transparent transparent transparent; }
.ld-ring div:nth-child(1){animation-delay:-.45s} .ld-ring div:nth-child(2){animation-delay:-.3s}
.ld-ring div:nth-child(3){animation-delay:-.15s}
@keyframes ring{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
.ld-txt { font-weight:600; margin-bottom:4px; }
.ld-sub { font-size:13px; color:var(--t2); }
/* Error */
.err-c { text-align:center; max-width:400px; padding:20px; }
.err-c h3 { color:var(--err); margin:10px 0 8px; }
.err-msg { font-size:13px; color:var(--t2); background:var(--errl);
  padding:8px 12px; border-radius:var(--r); margin-bottom:8px; word-break:break-word; white-space:pre-wrap; }
.err-hint { font-size:12px; color:var(--t3); }
/* Empty */
.emp-c { text-align:center; padding:28px 20px; }
.emp-glyph { width:60px; height:60px; background:var(--al); color:var(--a);
  border-radius:14px; display:inline-flex; align-items:center; justify-content:center;
  font-family:'Lexend',sans-serif; font-size:20px; font-weight:700; margin-bottom:14px; }
.emp-c h3 { font-size:17px; margin-bottom:6px; }
.emp-c p { color:var(--t2); font-size:14px; margin-bottom:14px; }
.chips { display:flex; gap:6px; flex-wrap:wrap; justify-content:center; }
.chip { font-size:12px; padding:4px 10px; background:var(--srf2);
  border:1px solid var(--bdr); border-radius:99px; color:var(--t2); }

/* ── Result Display ── */
.res-wrap { display:flex; flex-direction:column; gap:10px; }
.rs { border-radius:var(--r2); border:1px solid var(--bdr); overflow:hidden; }
.rs-hd { display:flex; align-items:center; gap:8px; padding:8px 14px;
  border-bottom:1px solid var(--bdr); background:var(--srf2); }
.rs-ico { font-size:14px; }
.rs-ttl { font-size:11px; font-weight:700; color:var(--t2);
  text-transform:uppercase; letter-spacing:.05em; }
.rs-rev .rs-hd { background:var(--al); border-color:oklch(.83 .07 193); }
.rs-th  .rs-hd { background:var(--okl); border-color:oklch(.83 .07 150); }
.rs-tip .rs-hd { background:var(--tipl); border-color:oklch(.86 .08 60); }
.dual { display:grid; grid-template-columns:1fr 1fr; }
.opt { padding:13px; }
.opt.opt-f { border-left:1px solid var(--bdr); }
.opt-meta { display:flex; align-items:center; gap:7px; margin-bottom:7px; flex-wrap:wrap; }
.opt-sub { font-size:11px; color:var(--t3); flex:1; }
.opt-txt { font-size:15px; color:var(--txt); line-height:1.65; }
.single { padding:13px; display:flex; align-items:flex-start; gap:12px; }
.single .opt-txt { flex:1; }
.bdg { font-size:10px; font-weight:700; padding:2px 8px; border-radius:99px;
  letter-spacing:.03em; white-space:nowrap; }
.bdg-d { background:var(--al); color:var(--at); }
.bdg-f { background:#e0e7ff; color:#3730a3; }
.th-txt { padding:13px; font-size:15px; line-height:1.7; }
.tip-txt { padding:13px; font-size:14px; color:var(--tip); line-height:1.7; }
.tbl-wrap { overflow-x:auto; }
.cmp-tbl { width:100%; border-collapse:collapse; font-size:13px; }
.cmp-tbl th { text-align:left; padding:7px 12px; background:var(--srf2);
  color:var(--t2); font-weight:600; font-size:12px; border-bottom:1px solid var(--bdr); }
.cmp-tbl td { padding:8px 12px; border-bottom:1px solid var(--bdr); vertical-align:top; }
.cmp-tbl tr:last-child td { border-bottom:none; }
.td-o { color:var(--err); text-decoration:line-through; }
.td-r { color:var(--ok); font-weight:600; }
.td-w { color:var(--t2); }
/* Copy button */
.cp-btn { font-size:11px; padding:3px 8px; border:1px solid var(--bdr2);
  border-radius:5px; background:var(--srf); color:var(--t2); cursor:pointer;
  transition:all .15s; white-space:nowrap; }
.cp-btn:hover { border-color:var(--a); color:var(--a); }
.cp-btn.done { border-color:var(--ok); color:var(--ok); background:var(--okl); }
/* Retry button */
.retry-btn { margin-top:10px; padding:8px 20px; background:var(--a); color:#fff;
  border:none; border-radius:var(--r); font-size:13px; font-weight:600;
  cursor:pointer; transition:all .15s; }
.retry-btn:hover { background:var(--ah); }

/* ── Side Panels ── */
.side-panel { height:100%; }
.bdg-cnt { font-size:11px; background:var(--srf2); border:1px solid var(--bdr);
  padding:1px 7px; border-radius:99px; color:var(--t3); }
.hist-item { padding:10px 13px; border-bottom:1px solid var(--bdr);
  cursor:pointer; transition:background .12s; }
.hist-item:hover { background:var(--srf2); }
.hist-item.on { background:var(--al); border-left:3px solid var(--a); }
.hist-in { font-size:13px; color:var(--txt); margin-bottom:3px; line-height:1.4; }
.hist-meta { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.hist-ctx { font-size:10px; color:var(--t3); background:var(--srf2);
  padding:1px 6px; border-radius:4px; }
.hist-tm { font-size:10px; color:var(--t3); font-family:'Lexend',sans-serif; }
.hist-prov { font-size:9px; color:var(--a); background:var(--al);
  padding:1px 5px; border-radius:4px; font-weight:600; }
/* Export buttons */
.export-btns { display:flex; gap:4px; }
.exp-btn { font-size:10px; padding:2px 7px; border:1px solid var(--bdr);
  border-radius:5px; background:none; color:var(--t2); cursor:pointer; transition:all .15s; }
.exp-btn:hover { border-color:var(--a); color:var(--a); }

/* ── Glossary ── */
.g-search { padding:8px 11px; border-bottom:1px solid var(--bdr); }
.srch-inp { width:100%; padding:6px 10px; border:1.5px solid var(--bdr);
  border-radius:var(--r); font-family:'Sarabun',sans-serif; font-size:13px;
  background:var(--srf2); color:var(--txt); outline:none; transition:border .15s; }
.srch-inp:focus { border-color:var(--a); background:var(--srf); }
.cat-tabs { display:flex; gap:4px; padding:6px 11px;
  border-bottom:1px solid var(--bdr); flex-wrap:wrap; }
.cat-tab { font-size:10px; padding:3px 7px; border:1px solid var(--bdr);
  border-radius:99px; background:none; color:var(--t2); cursor:pointer; transition:all .15s; }
.cat-tab:hover { border-color:var(--a); color:var(--a); }
.cat-tab.on { background:var(--a); border-color:var(--a); color:#fff; }
.g-item { padding:8px 12px; border-bottom:1px solid var(--bdr); position:relative; cursor:default; }
.g-item:hover .g-ins { opacity:1; }
.g-term { font-size:14px; font-weight:700; color:var(--at); font-family:'Lexend',sans-serif; }
.g-full { font-size:11px; color:var(--t2); margin:2px 0 3px; }
.g-thai { font-size:13px; color:var(--txt); }
.g-cat { position:absolute; top:8px; right:32px; font-size:9px; padding:2px 6px;
  border-radius:4px; font-weight:700; text-transform:uppercase; }
.g-ins { position:absolute; top:8px; right:8px; font-size:11px; width:22px; height:22px;
  border:1px solid var(--bdr); border-radius:5px; background:var(--srf2); color:var(--t2);
  cursor:pointer; display:flex; align-items:center; justify-content:center;
  opacity:0; transition:all .15s; }
.g-ins:hover { border-color:var(--a); color:var(--a); background:var(--al); }
.g-item.custom-entry { background:oklch(0.98 0.01 280); }
.dark .g-item.custom-entry { background:oklch(0.20 0.02 280); }
.g-del { position:absolute; bottom:8px; right:8px; font-size:10px; padding:1px 5px;
  border:1px solid #fca5a5; border-radius:4px; background:none; color:var(--err);
  cursor:pointer; opacity:0; transition:opacity .15s; }
.g-item:hover .g-del { opacity:1; }
/* Custom glossary add form */
.g-add-form { padding:10px 11px; border-bottom:1px solid var(--bdr); background:var(--srf2); }
.g-add-row { display:flex; gap:5px; margin-bottom:5px; }
.g-add-inp { flex:1; padding:5px 8px; border:1.5px solid var(--bdr); border-radius:6px;
  font-family:'Sarabun',sans-serif; font-size:12px; background:var(--srf); color:var(--txt); outline:none; }
.g-add-inp:focus { border-color:var(--a); }
.g-add-sel { padding:5px 8px; border:1.5px solid var(--bdr); border-radius:6px;
  font-size:12px; background:var(--srf); color:var(--txt); outline:none; cursor:pointer; }
.g-add-btn { padding:5px 10px; background:var(--a); color:#fff; border:none;
  border-radius:6px; font-size:12px; font-weight:600; cursor:pointer; white-space:nowrap; }
.g-add-btn:hover { background:var(--ah); }
.g-add-cancel { padding:5px 8px; background:none; border:1px solid var(--bdr);
  border-radius:6px; font-size:12px; color:var(--t2); cursor:pointer; }

/* Category colors */
.gc-product{background:#e0f2fe;color:#0369a1} .gc-quality{background:#fef3c7;color:#92400e}
.gc-process{background:#f0fdf4;color:#166534} .gc-chemical{background:#fdf4ff;color:#7e22ce}
.gc-equipment{background:#fff7ed;color:#9a3412} .gc-control{background:var(--al);color:var(--at)}
.gc-instrument{background:#e0e7ff;color:#3730a3} .gc-operations{background:#f1f5f9;color:#475569}
.gc-safety{background:#fee2e2;color:#b91c1c} .gc-maintenance{background:#ecfdf5;color:#065f46}
.gc-document{background:#f8fafc;color:#64748b} .gc-custom{background:#ede9fe;color:#5b21b6}

/* Modal */
.modal-ov { position:fixed; inset:0; background:oklch(0 0 0/.5);
  display:flex; align-items:center; justify-content:center; z-index:100;
  backdrop-filter:blur(3px); }
.modal-box { background:var(--srf); border-radius:var(--r2); padding:28px;
  max-width:480px; width:95%; box-shadow:0 24px 48px oklch(0 0 0/.2); }
.modal-ico { font-size:34px; margin-bottom:8px; text-align:center; }
.modal-box h2 { font-size:18px; font-weight:700; margin-bottom:5px; text-align:center; }
.modal-desc { color:var(--t2); font-size:13px; margin-bottom:14px; text-align:center; }
.key-card { border:1.5px solid var(--bdr); border-radius:var(--r); padding:10px 12px; margin-bottom:8px; }
.key-card.recommended { border-color:var(--a); background:var(--al); }

  return(<TweakRow label={label}><div ref={trackRef} role="radiogroup" onPointerDown={onPD} className={dragging?'twk-seg dragging':'twk-seg'}><div className="twk-seg-thumb" style={{left:`calc(2px + ${idx} * (100% - 4px) / ${n})`,width:`calc((100% - 4px) / ${n})`}}/>{opts.map(o=><button key={o.value} type="button" role="radio" aria-checked={o.value===value}>{o.label}</button>)}</div></TweakRow>);
}
Object.assign(window,{useTweaks,TweaksPanel,TweakSection,TweakRow,TweakSlider,TweakToggle,TweakRadio,TweakSelect});
</script>

<!-- ── Main App ── -->
<script type="text/babel">
const { useState, useRef, useEffect, useCallback } = React;
const { useTweaks, TweaksPanel, TweakSection, TweakRadio, TweakSelect, TweakSlider, TweakToggle } = window;
const PROVIDER_ORDER = window.PROVIDER_ORDER;
const PROVIDER_LABELS = window.PROVIDER_LABELS;

/* ── Helpers ── */
const fmtTime = ts => new Date(ts).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});
const fmtDT = ts => new Date(ts).toLocaleString('th-TH');

const detectProvider = k => {
  if(!k) return null;
  if(k.startsWith('gsk_'))    return 'groq';
  if(k.startsWith('sk-or-'))  return 'openrouter';
  if(k.startsWith('AIza'))    return 'gemini';
  if(k.startsWith('sk-ant-')) return 'claude';
  return null;
};

const detectSensitiveTerms = text => {
  const patterns = [
    /\b[A-Z]{2,4}-\d{3,4}[A-Z]?\d?\b/g,
    /\d+\.?\d*\s*(?:°C|°F|bar[g]?|kPa|MPa|kg\/h|t\/h|m³\/h|ppm|rpm|%)/g,
    /\b\d{5,}\b/g,
  ];
  const found = new Set();
  patterns.forEach(p => { const m = text.match(p); if(m) m.forEach(x => found.add(x.trim())); });
  return [...found];
};

const parseRaw = raw => {
  // Strip markdown code fences that some models add (e.g. ```json ... ```)
  let text = raw.replace(/^```(?:json)?\s*/i, '').replace(/\s*```\s*$/i, '').trim();
  try { return JSON.parse(text); }
  catch {
    // Last resort: pull out the first {...} block
    const m = text.match(/\{[\s\S]*\}/);
    if(!m) throw new Error('AI ตอบกลับไม่ถูกรูปแบบ JSON กรุณาลองใหม่');
    try { return JSON.parse(m[0]); }
    catch { throw new Error('AI ตอบกลับไม่ถูกรูปแบบ JSON กรุณาลองใหม่'); }
  }
};

const downloadFile = (filename, content) => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿'+content], {type:'text/plain;charset=utf-8'}));
  a.download = filename; a.click();
};

const callProvider = async (provider, key, userMsg, sysPrompt, geminiModel) => {
  if(provider === 'gemini') {
    const url = 'https://generativelanguage.googleapis.com/v1beta/models/'+geminiModel+':generateContent?key='+key;
    const res = await fetch(url, {method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({contents:[{role:'user',parts:[{text:userMsg}]}],
        systemInstruction:{parts:[{text:sysPrompt}]},
        generationConfig:{maxOutputTokens:1500,temperature:0.4,responseMimeType:'application/json'}})});
    const txt = await res.text();
    if(!res.ok){let m='Gemini error '+res.status;try{const d=JSON.parse(txt);m=d.error?.message||m;}catch{}throw new Error(m);}
    const d = JSON.parse(txt);
    if(!d.candidates?.[0]) throw new Error('Gemini ไม่ส่งผลลัพธ์กลับมา');
    return d.candidates[0].content.parts[0].text.trim();
  }
  if(provider === 'claude') {
    const res = await fetch('https://api.anthropic.com/v1/messages',{method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':key,
        'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-opus-4-5',max_tokens:1500,system:sysPrompt,
        messages:[{role:'user',content:userMsg}]})});
    if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(e.error?.message||'Claude error '+res.status);}
    const d = await res.json();
    return d.content[0].text.trim();
  }
  // Groq & OpenRouter (OpenAI-compatible)
  const isGroq = provider === 'groq';
  const url = isGroq ? 'https://api.groq.com/openai/v1/chat/completions' : 'https://openrouter.ai/api/v1/chat/completions';
  const model = isGroq ? 'llama-3.3-70b-versatile' : 'meta-llama/llama-3.3-70b-instruct:free';
  const headers = {'Content-Type':'application/json','Authorization':'Bearer '+key};
  if(!isGroq) headers['HTTP-Referer'] = 'https://pta-translator.local';
  const res = await fetch(url, {method:'POST',headers,
    body:JSON.stringify({model,max_tokens:1500,temperature:0.4,
      messages:[{role:'system',content:sysPrompt},{role:'user',content:userMsg}]})});
  if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(e.error?.message||(isGroq?'Groq':'OpenRouter')+' error '+res.status);}
  const d = await res.json();
  return d.choices[0].message.content.trim();
};

/* ── CopyButton ── */
function CopyButton({ text }) {
  const [done, setDone] = useState(false);
  const copy = async () => {
    try { await navigator.clipboard.writeText(text); }
    catch { const t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();document.execCommand('copy');document.body.removeChild(t); }
    setDone(true); setTimeout(()=>setDone(false),2000);
  };
  return <button className={`cp-btn ${done?'done':''}`} onClick={copy}>{done?'✓ Copied!':'📋 Copy'}</button>;
}

/* ── VoiceButton ── */
function VoiceButton({ onResult }) {
  const [listening, setListening] = useState(false);
  const recRef = useRef(null);
  const toggle = () => {
    if(listening){ recRef.current?.stop(); setListening(false); return; }
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SR){ alert('Browser ไม่รองรับ Voice Input\nลองใช้ Chrome บน HTTPS หรือ localhost'); return; }
    const rec = new SR();
    rec.lang = 'th-TH'; rec.interimResults = false; rec.maxAlternatives = 1;
    rec.onresult = e => onResult(e.results[0][0].transcript);
    rec.onend = () => setListening(false);
    rec.onerror = () => setListening(false);
    rec.start(); recRef.current = rec; setListening(true);
  };
  return <button className={`voice-btn ${listening?'active':''}`} onClick={toggle} title={listening?'หยุดฟัง':'เริ่มพูด (ภาษาไทย)'}>{listening?'🔴':'🎤'}</button>;
}

    {id:'openrouter',name:'🔀 OpenRouter',      free:true,  hint:'key: sk-or-...',    link:'https://openrouter.ai/keys'},
    {id:'gemini',    name:'✨ Google AI Studio',free:true,  hint:'key: AIza...',       link:'https://aistudio.google.com/apikey'},
    {id:'claude',    name:'🧠 Anthropic Claude',free:false, hint:'key: sk-ant-...',    link:'https://console.anthropic.com'},
  ];
  return (
    <div className="modal-ov" onClick={e=>e.target===e.currentTarget&&onSkip()}>
      <div className="modal-box">
        <div className="modal-ico">🔑</div>
        <h2>ตั้งค่า API Keys</h2>
        <p className="modal-desc">ใส่ key ที่มี — แอปจะลองตามลำดับ Groq → OpenRouter → Gemini → Claude อัตโนมัติ</p>
        {providerInfo.map(p=>(
          <div key={p.id} className={`key-card ${p.rec?'recommended':''}`}>
            <div className="key-card-hd">
              <span className="key-card-name">{p.name}</span>
              <span className={`key-card-badge ${p.free?'badge-free':'badge-paid'}`}>{p.free?'ฟรี':'Pay-per-use'}</span>
            </div>
            <div className="key-inp-row">
              <input className="modal-inp" type="password" placeholder={p.hint}

        <p className="modal-hint">🔒 Keys เก็บไว้ใน browser เท่านั้น | ใส่แค่ตัวเดียวก็ใช้ได้</p>
        <div className="modal-acts">
          <button className="btn-p" onClick={save} disabled={!hasAny}>บันทึก & เริ่มใช้งาน</button>
          <button className="btn-g" onClick={onSkip}>Demo Mode</button>
        </div>
      </div>

  );
}

        </div>
      )}
      <div className="g-search">
        <input className="srch-inp" type="text" placeholder="ค้นหาคำศัพท์..." value={q} onChange={e=>setQ(e.target.value)}/>
      </div>
      <div className="cat-tabs">
        {cats.map(c=><button key={c} className={`cat-tab ${cat===c?'on':''}`} onClick={()=>setCat(c)}>{c}</button>)}
      </div>
      <div className="p-scroll">
        {filtered.length===0 ? <div className="p-empty">ไม่พบคำที่ค้นหา</div> : filtered.map(g=>(
          <div key={g.term+(g._custom?'_c':'')} className={`g-item ${g._custom?'custom-entry':''}`}>
            <div className="g-term">{g.term}</div>
            {g.full && <div className="g-full">{g.full}</div>}
            <div className="g-thai">{g.thai}</div>
            <span className={`g-cat gc-${g.cat.toLowerCase()}`}>{g.cat}</span>
            {onInsert && <button className="g-ins" onClick={()=>onInsert(g.term)} title="แทรกในข้อความ">+</button>}
            {g._custom && <button className="g-del" onClick={()=>delEntry(g.term)}>ลบ</button>}
          </div>
        ))}
      </div>
    </div>
  );
}

/* ── Layouts ── */
function SplitLayout({ inP, outP, hist, onSel, aid, gProps }) {
  const [fp, setFp] = useState(null);
  const tog = p => setFp(f=>f===p?null:p);
  return (
    <div className="ly-split">
      <div className="sp-inp"><InputPanel {...inP}/></div>
      <div className="sp-out"><OutputPanel {...outP}/></div>
      <div className="float-tools">
        <button className="float-btn" title="ประวัติการแปล" onClick={()=>tog('h')}>🕒</button>
        <button className="float-btn" title="คลังศัพท์ PTA" onClick={()=>tog('g')}>📚</button>
      </div>
      {fp==='h' && <div className="float-pane"><HistoryPanel hist={hist} onSel={it=>{onSel(it);setFp(null);}} activeId={aid}/></div>}
      {fp==='g' && <div className="float-pane" style={{right:16}}><GlossaryPanel {...gProps}/></div>}
    </div>
  );
}
function CommandLayout({ inP, outP, hist, onSel, aid, gProps }) {
  return (
    <div className="ly-cmd">
      <HistoryPanel hist={hist} onSel={onSel} activeId={aid}/>
      <div className="cmd-main">
        <InputPanel {...inP}/>
        <OutputPanel {...outP}/>
      </div>
      <GlossaryPanel {...gProps}/>
    </div>
  );
}
function FlowLayout({ inP, outP, hist, onSel, aid, gProps }) {
  const [tab, setTab] = useState('h');
  return (
    <div className="ly-flow">
      <div className="flow-inner">
        <div className="panel flow-card"><InputPanel {...inP}/></div>
        <div className="flow-div"><div className="flow-div-line"/><span>↓ ผลการแปล</span><div className="flow-div-line"/></div>
        <div className="panel flow-card" style={{minHeight:280}}><OutputPanel {...outP}/></div>
      </div>
      <div className="flow-tabs-wrap">
        <div className="flow-tab-hd">
          <button className={`flow-tab-btn ${tab==='h'?'on':''}`} onClick={()=>setTab('h')}>🕒 ประวัติการแปล</button>
          <button className={`flow-tab-btn ${tab==='g'?'on':''}`} onClick={()=>setTab('g')}>📚 คลังศัพท์</button>
        </div>
        <div className="flow-tab-body">
          {tab==='h' ? <HistoryPanel hist={hist} onSel={onSel} activeId={aid}/> : <GlossaryPanel {...gProps}/>}
        </div>
      </div>
    </div>
  );
}

/* ── App ── */
function App() {
  const [t, setTweak] = useTweaks({ layout:'command', geminiModel:'gemini-2.5-flash', darkMode:false, fontSize:15 });

  // Load keys with migration from old single-key format
  const [apiKeys, setApiKeys] = useState(() => {
    const empty = {groq:'',openrouter:'',gemini:'',claude:''};
    try {
      const stored = JSON.parse(localStorage.getItem('pta-keys') || 'null');
      if(stored) return {...empty,...stored};
      const old = localStorage.getItem('pta-key');
      if(old) { const p=detectProvider(old); if(p) return {...empty,[p]:old}; }
    } catch {}
    return empty;
  });

  const [showModal, setShowModal] = useState(false);
  const [text, setText] = useState('');
  const [ctx, setCtx] = useState('logbook');
  const [direction, setDirection] = useState('th-en');
  const [loading, setLoading] = useState(false);
  const [result, setResult] = useState(null);
  const [error, setError] = useState(null);
  const [lastProvider, setLastProvider] = useState(null);
  const [hist, setHist] = useState(() => { try{return JSON.parse(localStorage.getItem('pta-hist')||'[]');}catch{return [];} });
  const [aid, setAid] = useState(null);
  const [customGlossary, setCustomGlossary] = useState(() => { try{return JSON.parse(localStorage.getItem('pta-custom')||'[]');}catch{return [];} });
  const taRef = useRef(null);

  useEffect(() => { document.body.classList.toggle('dark', t.darkMode); }, [t.darkMode]);
  useEffect(() => { document.body.style.fontSize = t.fontSize + 'px'; }, [t.fontSize]);
  useEffect(() => { const hasAny=Object.values(apiKeys).some(v=>v.trim()); if(!hasAny) setShowModal(true); }, []);

  const go = useCallback(async () => {
    const enabled = PROVIDER_ORDER.filter(p => apiKeys[p]?.trim());
    if(!enabled.length) { setShowModal(true); return; }
    if(!text.trim()) return;
    setLoading(true); setError(null); setResult(null);
    const sysPrompt = direction==='en-th' ? window.SYSTEM_PROMPT_EN_TH : window.SYSTEM_PROMPT;
    const userMsg = `Context: ${window.CTX_LABELS[ctx]}\n\nOriginal text:\n"${text}"`;
    const errors = [];
    let succeeded = false;
    for(const provider of enabled) {
      try {
        const raw = await callProvider(provider, apiKeys[provider], userMsg, sysPrompt, t.geminiModel);
        const parsed = parseRaw(raw);
        setResult(parsed); setLastProvider(provider);
        const entry = {id:Date.now(),input:text,ctx,result:parsed,ts:new Date().toISOString(),provider};
        const nh = [entry,...hist].slice(0,20);
        setHist(nh); setAid(entry.id);
        localStorage.setItem('pta-hist', JSON.stringify(nh));
        succeeded = true; break;
      } catch(e) {
        console.warn(`[${provider}]`, e.message);
        errors.push(`${provider}: ${e.message}`);
      }
    }
    if(!succeeded) setError(errors.join('\n'));
    setLoading(false);
  }, [apiKeys, text, ctx, direction, hist, t.geminiModel]);

  const insertToInput = useCallback(term => {
    const ta = taRef.current;
    if(!ta) { setText(prev => prev ? prev+' '+term : term); return; }
    const s=ta.selectionStart, e=ta.selectionEnd;
    const insert = (s===e && s>0 && text[s-1]!==' ') ? ' '+term : term;
    const newText = text.slice(0,s)+insert+text.slice(e);
    setText(newText);
    requestAnimationFrame(()=>{ ta.focus(); ta.setSelectionRange(s+insert.length,s+insert.length); });
  }, [text]);

  const onSel = item => { setText(item.input); setCtx(item.ctx); setResult(item.result); setAid(item.id); };
  const enabledCount = PROVIDER_ORDER.filter(p=>apiKeys[p]?.trim()).length;

  const headerLabel = () => {
    if(!enabledCount) return '🔑 ตั้งค่า API Key';
    if(lastProvider) return '🟢 '+PROVIDER_LABELS[lastProvider];
    return `🔑 ${enabledCount} key${enabledCount>1?'s':''} ready`;
  };

  const inP = { text, setText, ctx, setCtx, onGo:go, loading, direction, setDirection, taRef };
  const outP = { result, loading, error, onRetry: go };
  const shared = { hist, onSel, aid };
  const gProps = { onInsert:insertToInput, customGlossary, setCustomGlossary };
  const Layout = t.layout==='split' ? SplitLayout : t.layout==='flow' ? FlowLayout : CommandLayout;

  return (
    <div className="app">
      {showModal && <ApiKeyModal apiKeys={apiKeys} onSave={k=>{setApiKeys(k);setShowModal(false);}} onSkip={()=>setShowModal(false)}/>}
      <header className="app-hd">
        <div className="brand">
          <span className="brand-name">PTA Language Assistant</span>
          <span className="brand-tag">GC-M</span>
        </div>
        <div className="hd-c">
          <div className="lay-tabs">
            {[['split','⚡ Split'],['command','🖥 Command'],['flow','📜 Flow']].map(([l,lb])=>(
              <button key={l} className={`lay-tab ${t.layout===l?'on':''}`} onClick={()=>setTweak('layout',l)}>{lb}</button>
            ))}
          </div>
        </div>
        <div className="hd-right">
          <button className={`api-btn ${enabledCount?'ok':'no'}`} onClick={()=>setShowModal(true)}
            title="จัดการ API Keys">
            {headerLabel()}
          </button>
          <button className="icon-btn" onClick={()=>window.postMessage({type:'__activate_edit_mode'},'*')} title="Settings ⚙️">⚙️</button>
        </div>
      </header>
      <main className="app-main">
        <Layout inP={inP} outP={outP} {...shared} gProps={gProps}/>
      </main>
      <TweaksPanel title="Settings">
        <TweakSection label="Layout"/>
        <TweakRadio label="View" id="layout" value={t.layout}
          options={['split','command','flow']} onChange={v=>setTweak('layout',v)}/>
        <TweakSection label="Display"/>
        <TweakSlider label="Font Size" value={t.fontSize} min={12} max={20} step={1} unit="px"
          onChange={v=>setTweak('fontSize',v)}/>
        <TweakToggle label="Dark Mode" value={t.darkMode} onChange={v=>setTweak('darkMode',v)}/>
        <TweakSection label="Gemini Model"/>
        <TweakSelect label="Model" id="geminiModel" value={t.geminiModel}
          options={['gemini-2.5-flash','gemini-2.5-pro','gemini-2.0-flash','gemini-1.5-flash']}
          onChange={v=>setTweak('geminiModel',v)}/>
        <TweakSection label="API Keys"/>
        <div style={{fontSize:11,color:'rgba(41,38,27,.6)',lineHeight:1.6}}>
          {PROVIDER_ORDER.map(p=>(
            <div key={p} style={{display:'flex',alignItems:'center',gap:5,marginBottom:3}}>
              <span style={{width:8,height:8,borderRadius:'50%',background:apiKeys[p]?'#34c759':'rgba(0,0,0,.15)',display:'inline-block',flexShrink:0}}/>
              <span>{PROVIDER_LABELS[p]}</span>
            </div>
          ))}
        </div>
        <button onClick={()=>setShowModal(true)}
          style={{width:'100%',padding:'7px 12px',background:'rgba(0,0,0,.06)',
            border:'.5px solid rgba(0,0,0,.1)',borderRadius:7,fontSize:11,fontWeight:600,cursor:'pointer'}}>
          🔑 แก้ไข API Keys
        </button>
        {enabledCount>0 && (
          <button onClick={()=>{setApiKeys({groq:'',openrouter:'',gemini:'',claude:''});localStorage.removeItem('pta-keys');localStorage.removeItem('pta-key');setLastProvider(null);}}
            style={{width:'100%',marginTop:4,padding:'6px 12px',background:'none',
              border:'.5px solid rgba(220,38,38,.4)',borderRadius:7,fontSize:11,color:'#dc2626',cursor:'pointer'}}>
            ลบ Keys ทั้งหมด
          </button>
        )}
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
